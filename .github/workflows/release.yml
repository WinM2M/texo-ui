name: Release

# Publishing is driven by a tag, so the artifact on npm always corresponds to a commit
# someone deliberately marked — never to whatever happened to be on a laptop.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate as CI. A tag must not be able to publish something that does not
      # lint, type-check, build or pass its tests.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package version $PKG" >&2
            exit 1
          fi

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --workspaces --dry-run

      # Dependency order: a package must be on the registry before the ones that depend
      # on it, or `npm publish` resolves an internal range that does not exist yet.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          set -e
          for pkg in core data-adapter react kit standalone; do
            npm publish -w "@texo-ui/$pkg" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
