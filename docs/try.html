<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Texo — drop-in example</title>
    <style>
      body { font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 24px; background: #0b1220; color: #e2e8f0; }
      main { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 0 0 20px; color: #94a3b8; }
      textarea { width: 100%; height: 190px; box-sizing: border-box; font: 13px/1.5 ui-monospace, monospace;
                 background: #111a2e; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; }
      button.run { margin: 12px 0 20px; padding: 8px 16px; border-radius: 8px; border: 1px solid #60a5fa;
                   background: #1d4ed8; color: #fff; font-size: 14px; cursor: pointer; }
      /* No styling for #out: the `:> theme` directive in the stream paints it. */
      #out { min-height: 120px; }
      #log { color: #94a3b8; font: 12px ui-monospace, monospace; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Texo — drop-in example</h1>
      <p><a href="./live.html" style="color:#60a5fa">Drive it with a live model &rarr;</a></p>
      <p>One script tag, no build step. The result pane below has no CSS of its own &mdash;
         the <code>:&gt; theme</code> directive in the stream styles it. Edit and press Run.</p>

      <textarea id="src">
Here is the analysis of your server costs:

:> theme
 - preset: "midnight-dark"

:> label
 - text: "Monthly cost: $1,240 (up 8% MoM)"

:> table
 - columns: ["Service", "Cost"]
 - rows: [{"Service":"EC2","Cost":800},{"Service":"RDS","Cost":440}]

:> button
 - label: "Open full breakdown"
 - action: "open-breakdown"
 - variant: "primary"
</textarea>

      <button class="run" id="run" type="button">Run</button>
      <div id="out"></div>
      <div id="log"></div>
    </main>

    <script src="./cdn/texo.min.js"></script>
    <script>
      var log = document.getElementById('log');
      var ui = Texo.init('#out');
      ui.on('action', function (action) {
        log.textContent = 'action → ' + JSON.stringify(action);
      });

      function run() {
        log.textContent = '';
        ui.reset();
        ui.stream(document.getElementById('src').value + '\n\n');
        ui.end();
      }

      document.getElementById('run').addEventListener('click', run);
      run();
    </script>
  </body>
</html>
